[package]
name = "ms-pac-forge"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "MS-PAC (Privilege Attribute Certificate) marshaling + Golden/Silver Kerberos ticket forgery, pure-Rust, byte-validated against a live Server 2025 KDC (pre-alpha, extracted from adhammer)"
rust-version = "1.88"
repository = "https://github.com/icedracon/ms-pac-forge"
documentation = "https://docs.rs/ms-pac-forge"
readme = "README.md"
keywords = ["ms-pac", "kerberos", "golden-ticket", "active-directory", "red-team"]
categories = ["authentication", "cryptography", "parser-implementations", "os::windows-apis"]

[dependencies]
thiserror      = "2"
# 1.5.3 kerbcore swap: ticket EncTicketPart build/parse + AES crypto move to kerbcore
# (from-scratch, no-panic DER + RFC3961 crypto), retiring picky-krb/picky-asn1 here so
# the whole adhammer tree can drop picky-krb. kerbcore 0.3.0 is published on crates.io;
# the `path` is dev convenience — on publish the dep resolves to `kerbcore = "0.3"` from
# the registry. kerbcore 0.3 sets this crate's MSRV floor (1.88).
kerbcore        = "0.3"
md-5            = "0.10"
md4             = "0.10"
hmac            = "0.12"
rand            = "0.8"
hex             = "0.4"

[dev-dependencies]
hex = "0.4"
